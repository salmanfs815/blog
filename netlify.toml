[build.environment]
DART_SASS_VERSION = "1.99.0"
GO_VERSION = "1.26.1"
HUGO_VERSION = "0.161.0"
NODE_VERSION = "24.14.1"
TZ = "America/Vancouver"

[build]
publish = "public"
command = """\
  git config core.quotepath false && \
  hugo build --gc --minify --baseURL "${URL}"
  """

# Business card QR code. 302 (temporary) so the destination can change later without browsers caching it.
[[redirects]]
from = "/card"
to = "/work/?utm_source=business_card&utm_medium=qr&utm_campaign=card_v1"
status = 302
